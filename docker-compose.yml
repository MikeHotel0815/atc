# filepath: docker-compose.yml
services:
  atc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atc
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.atc.rule=Host(`atc.himmelreich.cloud`)"
      - "traefik.http.routers.atc.entrypoints=web"
      - "traefik.http.services.atc.loadbalancer.server.port=80"
    depends_on:
      - atc-api

  atc-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: atc-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      TZ: Europe/Berlin
    networks:
      - proxy

networks:
  proxy:
    external: true
